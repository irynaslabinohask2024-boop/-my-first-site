
<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Combat System</title>

<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">

<style>

/* ===== BASE ===== */
body{
    margin:0;
    font-family:Inter;
    background:linear-gradient(135deg,#071A2F,#143B63);
    color:white;
}

/* ===== HEADER ===== */
header{
    text-align:center;
    padding:40px;
    font-family:"Playfair Display", serif;
}

/* ===== LAYOUT ===== */
.container{
    max-width:1100px;
    margin:auto;
    padding:20px;
}

/* ===== CARD (ЄДИНИЙ СТИЛЬ ДЛЯ ВСЬОГО) ===== */
.card{
    background:rgba(255,255,255,0.07);
    backdrop-filter:blur(12px);
    border-radius:18px;
    padding:25px;
    margin:20px 0;
    box-shadow:0 10px 25px rgba(0,0,0,0.3);
}

/* ===== TYPOGRAPHY ===== */
h1,h2{
    font-family:"Playfair Display", serif;
}

/* ===== INPUTS ===== */
input, textarea, select{
    width:100%;
    margin-top:10px;
    padding:12px;
    border:none;
    border-radius:10px;
    outline:none;
    font-family:Inter;

    background:rgba(255,255,255,0.12);
    color:white;
}

/* ===== BUTTONS ===== */
button{
    width:100%;
    padding:12px;
    border:none;
    border-radius:10px;
    margin-top:10px;

    background:#2D6A8D;
    color:white;
    cursor:pointer;
    transition:0.3s;
    font-family:Inter;
}

button:hover{
    background:#A7C7E7;
    color:#071A2F;
}

/* ===== QR ===== */
#qrBox img{
    margin-top:15px;
    width:200px;
    padding:10px;
    background:white;
    border-radius:12px;
}

/* ===== STATUS ===== */
.status{
    margin-top:10px;
    opacity:0.8;
}

</style>
</head>

<body>

<header>
    <h1>🛡 AI COMBAT SYSTEM</h1>
    <p>Інтелектуальна бойова платформа нового покоління</p>
</header>

<div class="container">

<!-- ================= TTS ================= -->
<div class="card">

<h2>🧠 TTS модуль</h2>

<textarea id="ttsText" placeholder="Введіть текст..."></textarea>

<select id="voices"></select>

<input type="range" id="rate" min="0.5" max="2" step="0.1" value="1">

<button onclick="speakText()">▶ Озвучити</button>

<p id="status" class="status">Готово</p>

</div>

<!-- ================= QR ================= -->
<div class="card">

<h2>📡 QR (Поділитися)</h2>

<input id="qrText" placeholder="Текст або посилання">

<button onclick="generateQR()">Створити QR</button>

<div id="qrBox"></div>

</div>

<!-- ================= SYSTEM ================= -->
<div class="card">

<h2>🛡 Функції системи</h2>

<ul>
<li>Захист від мін і ракет</li>
<li>Автономна евакуація</li>
<li>Медичний модуль</li>
<li>Кіберзахист</li>
</ul>

</div>

<!-- ================= SECURITY ================= -->
<div class="card">

<h2>🔐 Контроль доступу (5 питань)</h2>

<input id="q1" placeholder="1. Код доступу">
<input id="q2" placeholder="2. Підрозділ">
<input id="q3" placeholder="3. Рівень доступу">
<input id="q4" placeholder="4. ID команди">
<input id="q5" placeholder="5. Підтвердження місії">

<button onclick="checkAccess()">Перевірити доступ</button>

<p id="accessStatus" class="status"></p>

</div>

</div>

<script>

/* ================= TTS ================= */

let voices = [];

function loadVoices(){
    voices = speechSynthesis.getVoices();
    let select = document.getElementById("voices");
    select.innerHTML = "";

    voices.forEach((v,i)=>{
        let opt = document.createElement("option");
        opt.value = i;
        opt.textContent = v.name + " (" + v.lang + ")";
        select.appendChild(opt);
    });
}

speechSynthesis.onvoiceschanged = loadVoices;
loadVoices();

function speakText(){

    let text = document.getElementById("ttsText").value;

    if(!text){
        alert("Введіть текст");
        return;
    }

    let utter = new SpeechSynthesisUtterance(text);

    let voiceIndex = document.getElementById("voices").value;

    utter.voice = voices[voiceIndex];
    utter.rate = document.getElementById("rate").value;

    document.getElementById("status").innerText = "🔊 Відтворення...";

    utter.onend = ()=>{
        document.getElementById("status").innerText = "Готово";
    };

    window.speechSynthesis.speak(utter);
}

/* ================= QR ================= */

function generateQR(){

    let text = document.getElementById("qrText").value;

    if(!text){
        alert("Введіть текст");
        return;
    }

    let url =
    "https://api.qrserver.com/v1/create-qr-code/?size=250x250&data="
    + encodeURIComponent(text);

    document.getElementById("qrBox").innerHTML =
    `<img src="${url}" alt="QR Code">`;
}

/* ================= ACCESS SYSTEM ================= */

function checkAccess(){

    let a1 = document.getElementById("q1").value;
    let a2 = document.getElementById("q2").value;
    let a3 = document.getElementById("q3").value;
    let a4 = document.getElementById("q4").value;
    let a5 = document.getElementById("q5").value;

    if(!a1 || !a2 || !a3 || !a4 || !a5){
        document.getElementById("accessStatus").innerText =
        "⚠ Заповніть усі поля";
        return;
    }

    if(a1 === "12345" && a3.toLowerCase() === "high"){
        document.getElementById("accessStatus").innerText =
        "🟢 Доступ дозволено";
    } else {
        document.getElementById("accessStatus").innerText =
        "🔴 Доступ відхилено";
    }
}

</script>

</body>
</html>
